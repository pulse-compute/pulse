[package]
name = "pulse-es256-rustcrypto-verifier"
version = "0.0.0"
edition = "2021"
publish = false
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ecdsa = { version = "=0.16.9", default-features = false, features = ["arithmetic", "hazmat"] }
p256 = { version = "=0.13.2", default-features = false, features = ["arithmetic"] }
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
