<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 574" role="img" aria-labelledby="title desc">
  <title id="title">Pulse: one application, two explicit execution targets</title>
  <desc id="desc">Application validation checks reachable source, topology, schemas and capabilities. The selected Native path lowers admitted operations to Wasm; the JavaScript path retains the resolved source graph. The selected provider packages the result and supplies host bindings. Target selection never falls back automatically.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#486581"/></marker>
  </defs>
  <rect width="840" height="574" rx="16" fill="#f5f8fc"/>
  <g stroke="#486581" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M420 112V151"/>
    <path d="M420 240V266H218V310"/>
    <path d="M420 266H622V310"/>
    <path d="M218 402V430H420V461"/>
    <path d="M622 402V430H420" marker-end="none"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="42" y="24" width="756" height="88" rx="12" fill="#ffffff" stroke="#c5d2e0"/>
    <text x="420" y="60" font-size="23" font-weight="700" fill="#172b4d">TypeScript application</text>
    <text x="420" y="89" font-size="19" fill="#43566e">Handlers · schemas · reusable computations</text>
    <rect x="42" y="152" width="756" height="88" rx="12" fill="#e9f1ff" stroke="#759cd2"/>
    <text x="420" y="188" font-size="23" font-weight="700" fill="#173d73">Application validation</text>
    <text x="420" y="217" font-size="19" fill="#304e73">Reachable source · topology · schemas · capabilities</text>
    <rect x="278" y="274" width="284" height="27" rx="6" fill="#f5f8fc"/>
    <text x="420" y="294" font-size="17" fill="#43566e">Explicit target from the profile</text>
    <rect x="42" y="312" width="352" height="90" rx="12" fill="#ffffff" stroke="#759cd2"/>
    <text x="218" y="348" font-size="23" font-weight="700" fill="#173d73">Native</text>
    <text x="218" y="378" font-size="18" fill="#43566e">Lower admitted operations to Wasm</text>
    <rect x="446" y="312" width="352" height="90" rx="12" fill="#ffffff" stroke="#759cd2"/>
    <text x="622" y="348" font-size="23" font-weight="700" fill="#173d73">JavaScript</text>
    <text x="622" y="378" font-size="18" fill="#43566e">Retain the resolved source graph</text>
    <rect x="42" y="463" width="756" height="87" rx="12" fill="#e9f1ff" stroke="#759cd2"/>
    <text x="420" y="499" font-size="23" font-weight="700" fill="#173d73">Selected provider: Node or Fastly</text>
    <text x="420" y="529" font-size="19" fill="#304e73">Target packaging · runtime integration · host bindings</text>
  </g>
</svg>
