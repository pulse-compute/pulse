name: Documentation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install lockfile-pinned workspace dependencies
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          corepack enable
          pnpm_version="$(node -p "require('./release/pulse-release-manifest.json').publication.pnpmVersion")"
          corepack prepare "pnpm@$pnpm_version" --activate
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate generated documentation
        run: pnpm run docs:check
      - name: Run documentation release gate
        run: node scripts/documentation-release.cjs
      - name: Build exact-version documentation site
        run: pnpm run docs:site --json
      - name: Seal a non-production documentation candidate
        run: node scripts/documentation-deployment.cjs seal --site-dir .pulse-docs-site --out .pulse-documentation-preview
      - name: Upload generated preview
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-documentation-preview-${{ github.run_id }}
          path: .pulse-documentation-preview
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
