name: Terminal local qualification

on:
  workflow_dispatch:
  pull_request:
    branches: [latest]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/terminal-qualification.yml'
      - 'wasm/test/qualification/terminal/**'
      - 'packages/grip/**'
      - 'packages/provider-fastly/**'
      - 'wasm/packages/contracts/**'
      - 'wasm/packages/compiler/**'

permissions:
  contents: read

concurrency:
  group: terminal-local-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      npm_config_ignore_scripts: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
      - name: Restore pinned build dependencies
        run: |
          set -euo pipefail
          node scripts/pnpm-toolchain.cjs --install
          .validation-tools/pnpm/bin/pnpm install --frozen-lockfile --ignore-scripts
      - name: Install local engine system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libdouble-conversion3 libpcre2-16-0 libproxy1v5 libzmq5 libicu74 libbrotli1 libdbus-1-3 libglib2.0-0t64 libgomp1 libgssapi-krb5-2 libssl3t64 libzstd1 zlib1g
      - name: Extract hash-pinned engines
        run: python3 wasm/test/qualification/terminal/install-engines.py "$RUNNER_TEMP/terminal-engines"
      - name: Build exact installed artifacts and replay local transports
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/terminal-evidence"
          node wasm/test/qualification/terminal/installed.cjs "$RUNNER_TEMP/terminal-evidence/bundle"
          node wasm/test/qualification/terminal/local.cjs "$RUNNER_TEMP/terminal-evidence/bundle" "$RUNNER_TEMP/terminal-engines/viceroy/viceroy" "$RUNNER_TEMP/terminal-engines/pushpin" "$RUNNER_TEMP/terminal-evidence/local.json"
      - name: Retain exact artifacts and receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terminal-local-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
