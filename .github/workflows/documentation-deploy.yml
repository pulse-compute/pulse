name: Documentation deployment

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag whose documentation should be deployed
        required: true
        type: string
      promote_latest:
        description: Promote root and latest only after the exact version and npm release are verified
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: documentation-production
  cancel-in-progress: false

jobs:
  candidate:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    name: candidate
    runs-on: ubuntu-latest
    outputs:
      candidate_artifact_id: ${{ steps.qualification.outputs.artifact_id }}
      qualification_run_id: ${{ steps.qualification.outputs.run_id }}
      selection: ${{ steps.qualification.outputs.selection }}
    timeout-minutes: 30
    steps:
      - name: Check out the selected release tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Resolve the qualified release PR
        id: qualification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const result = await require('./scripts/release-qualification.cjs').resolveQualification({
              github, context, releaseTag: process.env.REQUESTED_TAG
            });
            core.setOutput('artifact_id', result.artifactId);
            core.setOutput('run_id', result.runId);
            core.setOutput('selection', JSON.stringify(result));
            core.info(`Using qualification ${result.runId}, attempt ${result.attempt}, artifact ${result.artifactId}`);
      - name: Download the qualified documentation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          artifact-ids: ${{ steps.qualification.outputs.artifact_id }}
          run-id: ${{ steps.qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .pulse-qualified
      - name: Authenticate the qualified artifacts and merge binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_SELECTION: ${{ steps.qualification.outputs.selection }}
        with:
          script: |
            await require('./scripts/release-qualification.cjs').consume({
              github, context, releaseTag: process.env.REQUESTED_TAG,
              selection: JSON.parse(process.env.QUALIFICATION_SELECTION),
              directory: '.pulse-qualified', bindingFile: 'qualification-binding.json'
            });

  deploy:
    name: deploy
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: documentation-production
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - name: Check out the sealed release tag deployment tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install the release-owned npm CLI
        run: npm install --global npm@11.15.0
      - name: Download the sealed documentation candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.candidate.outputs.candidate_artifact_id }}
          run-id: ${{ needs.candidate.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: .pulse-qualified
      - name: Authenticate the qualified artifacts and merge binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_SELECTION: ${{ needs.candidate.outputs.selection }}
        with:
          script: |
            await require('./scripts/release-qualification.cjs').consume({
              github, context, releaseTag: process.env.REQUESTED_TAG,
              selection: JSON.parse(process.env.QUALIFICATION_SELECTION),
              directory: '.pulse-qualified', bindingFile: 'qualification-binding.json'
            });
      - name: Verify protected deployment configuration
        shell: bash
        env:
          FASTLY_OBJECT_STORAGE_BUCKET: ${{ vars.FASTLY_OBJECT_STORAGE_BUCKET }}
          FASTLY_OBJECT_STORAGE_REGION: ${{ vars.FASTLY_OBJECT_STORAGE_REGION }}
          FASTLY_OBJECT_STORAGE_ENDPOINT: ${{ vars.FASTLY_OBJECT_STORAGE_ENDPOINT }}
          FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID }}
          FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          PULSE_DOCUMENTATION_ORIGIN: ${{ vars.PULSE_DOCUMENTATION_ORIGIN }}
          PULSE_DOCUMENTATION_BASE_PATH: ${{ vars.PULSE_DOCUMENTATION_BASE_PATH }}
        run: |
          set -euo pipefail
          aws --version
          test -n "$FASTLY_OBJECT_STORAGE_BUCKET"
          test -n "$FASTLY_OBJECT_STORAGE_REGION"
          test -n "$FASTLY_OBJECT_STORAGE_ENDPOINT"
          test -n "$FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID"
          test -n "$FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY"
          test -n "$PULSE_DOCUMENTATION_ORIGIN"
          test -n "$PULSE_DOCUMENTATION_BASE_PATH"
          node <<'NODE'
          const manifest = require('./release/pulse-release-manifest.json');
          if (process.env.PULSE_DOCUMENTATION_ORIGIN !== manifest.documentation.origin) throw new Error('PULSE_DOCUMENTATION_ORIGIN differs from the release manifest');
          if (process.env.PULSE_DOCUMENTATION_BASE_PATH !== manifest.documentation.basePath) throw new Error('PULSE_DOCUMENTATION_BASE_PATH differs from the release manifest');
          NODE
          node scripts/documentation-deployment.cjs verify-candidate \
            --candidate-dir .pulse-qualified/documentation \
            --require-release-ref --qualification-binding qualification-binding.json
      - name: Upload and verify the immutable exact-version tree
        shell: bash
        env:
          FASTLY_OBJECT_STORAGE_BUCKET: ${{ vars.FASTLY_OBJECT_STORAGE_BUCKET }}
          FASTLY_OBJECT_STORAGE_REGION: ${{ vars.FASTLY_OBJECT_STORAGE_REGION }}
          FASTLY_OBJECT_STORAGE_ENDPOINT: ${{ vars.FASTLY_OBJECT_STORAGE_ENDPOINT }}
          FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID }}
          FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          PULSE_DOCUMENTATION_ORIGIN: ${{ vars.PULSE_DOCUMENTATION_ORIGIN }}
          PULSE_DOCUMENTATION_BASE_PATH: ${{ vars.PULSE_DOCUMENTATION_BASE_PATH }}
        run: |
          set -euo pipefail
          node scripts/documentation-deployment.cjs deploy \
            --candidate-dir .pulse-qualified/documentation \
            --require-release-ref --qualification-binding qualification-binding.json \
            --driver aws \
            --phase immutable \
            --json-out documentation-immutable-deployment.json
          node scripts/documentation-deployment.cjs verify-storage \
            --candidate-dir .pulse-qualified/documentation \
            --require-release-ref --qualification-binding qualification-binding.json \
            --driver aws \
            --phase immutable \
            --json-out documentation-immutable-verification.json
      - name: Verify the matching npm release before promotion
        if: inputs.promote_latest
        run: >-
          node scripts/verify-npm-release.cjs
          --catalog-only
          --json-out npm-release-availability.json
      - name: Verify protected CDN purge configuration
        if: inputs.promote_latest
        shell: bash
        env:
          FASTLY_DOCUMENTATION_SERVICE_ID: ${{ vars.FASTLY_DOCUMENTATION_SERVICE_ID }}
          FASTLY_DOCUMENTATION_PURGE_TOKEN: ${{ secrets.FASTLY_DOCUMENTATION_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$FASTLY_DOCUMENTATION_SERVICE_ID" =~ ^[A-Za-z0-9]+$ ]] || { echo '::error::Set FASTLY_DOCUMENTATION_SERVICE_ID in documentation-production'; exit 1; }
          test -n "$FASTLY_DOCUMENTATION_PURGE_TOKEN" || { echo '::error::Set FASTLY_DOCUMENTATION_PURGE_TOKEN in documentation-production'; exit 1; }
      - name: Promote root and latest routes
        if: inputs.promote_latest
        shell: bash
        env:
          FASTLY_OBJECT_STORAGE_BUCKET: ${{ vars.FASTLY_OBJECT_STORAGE_BUCKET }}
          FASTLY_OBJECT_STORAGE_REGION: ${{ vars.FASTLY_OBJECT_STORAGE_REGION }}
          FASTLY_OBJECT_STORAGE_ENDPOINT: ${{ vars.FASTLY_OBJECT_STORAGE_ENDPOINT }}
          FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID: ${{ secrets.FASTLY_OBJECT_STORAGE_ACCESS_KEY_ID }}
          FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${{ secrets.FASTLY_OBJECT_STORAGE_SECRET_ACCESS_KEY }}
          PULSE_DOCUMENTATION_ORIGIN: ${{ vars.PULSE_DOCUMENTATION_ORIGIN }}
          PULSE_DOCUMENTATION_BASE_PATH: ${{ vars.PULSE_DOCUMENTATION_BASE_PATH }}
        run: |
          set -euo pipefail
          node scripts/documentation-deployment.cjs deploy \
            --candidate-dir .pulse-qualified/documentation \
            --require-release-ref --qualification-binding qualification-binding.json \
            --driver aws \
            --phase promote \
            --npm-verification npm-release-availability.json \
            --json-out documentation-promotion-deployment.json
          node scripts/documentation-deployment.cjs verify-storage \
            --candidate-dir .pulse-qualified/documentation \
            --require-release-ref --qualification-binding qualification-binding.json \
            --driver aws \
            --phase promote \
            --json-out documentation-promotion-verification.json
      - name: Purge the documentation CDN before public verification
        if: inputs.promote_latest
        timeout-minutes: 2
        shell: bash
        env:
          FASTLY_DOCUMENTATION_SERVICE_ID: ${{ vars.FASTLY_DOCUMENTATION_SERVICE_ID }}
          FASTLY_DOCUMENTATION_PURGE_TOKEN: ${{ secrets.FASTLY_DOCUMENTATION_PURGE_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$FASTLY_DOCUMENTATION_SERVICE_ID" =~ ^[A-Za-z0-9]+$ ]]
          test -n "$FASTLY_DOCUMENTATION_PURGE_TOKEN"
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 2 \
            --request POST \
            --header "Fastly-Key: $FASTLY_DOCUMENTATION_PURGE_TOKEN" \
            --header 'Accept: application/json' \
            --output documentation-cdn-purge.json \
            "https://api.fastly.com/service/$FASTLY_DOCUMENTATION_SERVICE_ID/purge_all"
          node <<'NODE'
          const result = require('./documentation-cdn-purge.json');
          if (result.status !== 'ok') throw new Error('Fastly documentation CDN purge did not return status=ok');
          console.log('Fastly documentation CDN purge accepted');
          NODE
      - name: Verify the public Fastly route after promotion
        if: inputs.promote_latest
        env:
          PULSE_DOCUMENTATION_ORIGIN: ${{ vars.PULSE_DOCUMENTATION_ORIGIN }}
          PULSE_DOCUMENTATION_BASE_PATH: ${{ vars.PULSE_DOCUMENTATION_BASE_PATH }}
        run: >-
          node scripts/documentation-deployment.cjs verify-public
          --origin "$PULSE_DOCUMENTATION_ORIGIN"
          --base-path "$PULSE_DOCUMENTATION_BASE_PATH"
          --json-out documentation-public-verification.json
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-documentation-production-${{ inputs.release_tag }}
          path: |
            qualification-binding.json
            npm-release-availability.json
            documentation-immutable-deployment.json
            documentation-immutable-verification.json
            documentation-promotion-deployment.json
            documentation-promotion-verification.json
            documentation-cdn-purge.json
            documentation-public-verification.json
          if-no-files-found: warn
          retention-days: 90
