name: npm publication

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to audit or publish
        required: true
        type: string
      operation:
        description: Audit or publish the automatically selected PR qualification
        required: true
        default: audit
        type: choice
        options:
          - audit
          - publish
      run_smoke:
        description: Run the published CLI clean-install smoke (context smoke is always required)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-publication-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  audit:
    name: audit
    if: inputs.operation == 'audit' || inputs.operation == 'publish'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      artifact_name: ${{ steps.approval.outputs.artifact_name }}
      manifest_sha256: ${{ steps.approval.outputs.manifest_sha256 }}
      candidate_artifact_id: ${{ steps.qualification.outputs.artifact_id }}
      qualification_run_id: ${{ steps.qualification.outputs.run_id }}
      selection: ${{ steps.qualification.outputs.selection }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the sealed release tag publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install the release-owned npm CLI
        run: npm install --global npm@11.15.0
      - name: Resolve the qualified release PR
        id: qualification
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const result = await require('./scripts/release-qualification.cjs').resolveQualification({
              github, context, releaseTag: process.env.REQUESTED_TAG
            });
            core.setOutput('artifact_id', result.artifactId);
            core.setOutput('run_id', result.runId);
            core.setOutput('selection', JSON.stringify(result));
            core.info(`Using qualification ${result.runId}, attempt ${result.attempt}, artifact ${result.artifactId}`);
      - name: Download the sealed npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          artifact-ids: ${{ steps.qualification.outputs.artifact_id }}
          run-id: ${{ steps.qualification.outputs.run_id }}
          github-token: ${{ github.token }}
          path: .pulse-qualified
      - name: Authenticate the qualified artifacts and merge binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_SELECTION: ${{ steps.qualification.outputs.selection }}
        with:
          script: |
            await require('./scripts/release-qualification.cjs').consume({
              github, context, releaseTag: process.env.REQUESTED_TAG,
              selection: JSON.parse(process.env.QUALIFICATION_SELECTION),
              directory: '.pulse-qualified', bindingFile: 'qualification-binding.json'
            });
      - name: Verify and bind the review packet to the sealed candidate
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-candidate.cjs verify --bundle-dir .pulse-qualified/publication --require-release-ref --qualification-binding qualification-binding.json
          echo "manifest_sha256=$(sha256sum .pulse-qualified/publication/pulse-publication-manifest.json | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          echo "artifact_name=pulse-npm-audit-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Audit package names and prepare the publication plan
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          audit_args=()
          plan_args=()
          if [ "$OPERATION" = 'audit' ]; then
            audit_args+=(--allow-missing)
            plan_args+=(--report-only)
          fi
          node scripts/publish-release.cjs audit \
            --bundle-dir .pulse-qualified/publication \
            --require-release-ref --qualification-binding qualification-binding.json \
            "${audit_args[@]}" \
            --json-out npm-package-name-audit.json
          node scripts/publish-release.cjs plan \
            --bundle-dir .pulse-qualified/publication \
            --require-release-ref --qualification-binding qualification-binding.json \
            "${plan_args[@]}" \
            --json-out npm-publication-plan.json
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-npm-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            qualification-binding.json
            npm-package-name-audit.json
            npm-publication-plan.json
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: publish
    if: inputs.operation == 'publish'
    needs: audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
      actions: read
      pull-requests: read
    steps:
      - name: Check out the sealed release tag publication tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install the release-owned npm CLI
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
      - name: Download the sealed npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.audit.outputs.candidate_artifact_id }}
          run-id: ${{ needs.audit.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: .pulse-qualified
      - name: Download the pre-approval audit and publication plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.audit.outputs.artifact_name }}
          path: .pulse-publication-audit
      - name: Authenticate the qualified artifacts and merge binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_SELECTION: ${{ needs.audit.outputs.selection }}
        with:
          script: |
            await require('./scripts/release-qualification.cjs').consume({
              github, context, releaseTag: process.env.REQUESTED_TAG,
              selection: JSON.parse(process.env.QUALIFICATION_SELECTION),
              directory: '.pulse-qualified', bindingFile: 'qualification-binding.json'
            });
      - name: Bind publication authority to the audited release tag
        shell: bash
        env:
          AUDITED_MANIFEST_SHA256: ${{ needs.audit.outputs.manifest_sha256 }}
        run: |
          set -euo pipefail
          node scripts/release-candidate.cjs verify --bundle-dir .pulse-qualified/publication --require-release-ref --qualification-binding qualification-binding.json
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const digest = crypto.createHash('sha256').update(fs.readFileSync('.pulse-qualified/publication/pulse-publication-manifest.json')).digest('hex');
          if (digest !== process.env.AUDITED_MANIFEST_SHA256) throw new Error('publication candidate differs from the pre-approval audit');
          const plan = JSON.parse(fs.readFileSync('.pulse-publication-audit/npm-publication-plan.json', 'utf8'));
          if (plan.status !== 'ready') throw new Error('pre-approval publication plan is not ready');
          const release = require('./release/pulse-release-manifest.json');
          const manifest = JSON.parse(fs.readFileSync('.pulse-qualified/publication/pulse-publication-manifest.json', 'utf8'));
          if (JSON.stringify(plan.source) !== JSON.stringify(manifest.source) || plan.releaseVersion !== manifest.releaseVersion) throw new Error('pre-approval plan source differs from the sealed candidate');
          const expectedRef = `refs/tags/v${release.releaseVersion}`;
          if (!/^[0-9a-f]{40}$/.test(manifest.source.commit)) throw new Error('sealed candidate source commit is invalid');
          if (process.env.GITHUB_REF !== expectedRef) throw new Error(`publication job must run from ${expectedRef}; found ${process.env.GITHUB_REF}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `PULSE_RELEASE_REF=${process.env.GITHUB_REF}\nPULSE_RELEASE_SHA=${process.env.GITHUB_SHA}\n`);
          NODE
      - name: Publish or resume the dependency-ordered release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/publish-release.cjs publish \
            --bundle-dir .pulse-qualified/publication \
            --require-release-ref --qualification-binding qualification-binding.json \
            --json-out npm-publication-report.json
      - name: Upload publication report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-npm-publish-${{ inputs.release_tag }}-${{ github.run_attempt }}
          path: |
            .pulse-publication-audit/npm-package-name-audit.json
            .pulse-publication-audit/npm-publication-plan.json
            qualification-binding.json
            npm-publication-report.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

  verify:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    name: verify
    if: inputs.operation == 'publish'
    needs: [audit, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the sealed release tag verification tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install the release-owned npm CLI
        run: npm install --global npm@11.15.0
      - name: Download the sealed npm candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          merge-multiple: true
          artifact-ids: ${{ needs.audit.outputs.candidate_artifact_id }}
          run-id: ${{ needs.audit.outputs.qualification_run_id }}
          github-token: ${{ github.token }}
          path: .pulse-qualified
      - name: Authenticate the qualified artifacts and merge binding
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
          QUALIFICATION_SELECTION: ${{ needs.audit.outputs.selection }}
        with:
          script: |
            await require('./scripts/release-qualification.cjs').consume({
              github, context, releaseTag: process.env.REQUESTED_TAG,
              selection: JSON.parse(process.env.QUALIFICATION_SELECTION),
              directory: '.pulse-qualified', bindingFile: 'qualification-binding.json'
            });
      - name: Verify registry integrity, dist-tags, and the published CLI
        shell: bash
        env:
          RUN_SMOKE: ${{ inputs.run_smoke }}
        run: |
          set -euo pipefail
          args=(--bundle-dir .pulse-qualified/publication --require-release-ref --qualification-binding qualification-binding.json --json-out npm-publication-verification.json)
          if [ "$RUN_SMOKE" = "true" ]; then
            args+=(--smoke --smoke-json-out npm-publication-smoke.json)
          fi
          node scripts/verify-npm-release.cjs "${args[@]}"
      - name: Smoke the published Pulse context app
        timeout-minutes: 15
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./release/pulse-release-manifest.json').releaseVersion")"
          node wasm/test/mcp/smoke-context-registry.cjs "$version"
          node - "$version" <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const report = JSON.parse(fs.readFileSync('wasm/.test-results/context-registry-smoke.json', 'utf8'));
          assert.equal(report.schemaVersion, 'pulse.context-registry-smoke.v1');
          assert.equal(report.status, 'passed');
          assert.equal(report.version, process.argv[2]);
          assert.equal(report.cleanup, 'passed');
          NODE
      - name: Upload publication verification
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-npm-verification-${{ inputs.release_tag }}-${{ github.run_attempt }}
          path: |
            qualification-binding.json
            npm-publication-verification.json
            npm-publication-smoke.json
            wasm/.test-results/context-registry-smoke.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
