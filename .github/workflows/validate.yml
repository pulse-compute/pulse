name: Repository validation

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: ['**']

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  route:
    name: validation route
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tier: ${{ steps.route.outputs.tier }}
      run: ${{ steps.route.outputs.run }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: route
        with:
          script: await require('./scripts/maintainer-validation-routing.cjs').route({ github, context, core })

  fast-selection:
    name: fast selection
    needs: route
    if: needs.route.outputs.run == 'true' && needs.route.outputs.tier == 'fast'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      status: ${{ steps.select.outputs.status }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
      - name: Check fast selection contract
        run: node wasm/test/ci/assert-fast-validation.cjs
      - name: Select trusted-base fast tasks
        id: select
        run: node scripts/maintainer-fast-validation.cjs --event --report wasm/.test-results/fast-selection.json
      - name: Upload selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-fast-selection-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm/.test-results/fast-selection.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  fast-portable:
    name: fast portable
    needs: fast-selection
    if: needs.fast-selection.outputs.status == 'selected'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
      - name: Install lockfile-pinned workspace dependencies
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          pnpm_version="$(node -p "require('./release/pulse-release-manifest.json').publication.pnpmVersion")"
          node scripts/pnpm-toolchain.cjs --install --version "$pnpm_version"
          export PATH="$PWD/.validation-tools/pnpm/bin:$PATH"
          echo "$PWD/.validation-tools/pnpm/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build workspace outputs
        run: pnpm run build
      - name: Run selected fast tasks at tested commit
        run: node scripts/maintainer-fast-validation.cjs --event --report wasm/.test-results/fast-run.json --run
      - name: Upload fast run evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-fast-portable-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm/.test-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  maintenance:
    name: maintenance
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
      - name: Validate maintainer control plane
        run: npm run maintainer:check
      - name: Validate branch routing and fast selection
        run: |
          node wasm/test/ci/assert-validation-routing.cjs
          node wasm/test/ci/assert-fast-validation.cjs
      - name: Validate portable aggregate contract
        run: node wasm/test/ci/assert-portable-validation.cjs
      - name: Check release preparation before main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
          RELEASE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release-pr-check.cjs --base "$RELEASE_BASE" --head "$RELEASE_HEAD"

  node-floor:
    name: node-floor
    needs: route
    if: needs.route.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22.x'
      - name: Install lockfile-pinned workspace dependencies
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          pnpm_version="$(node -p "require('./release/pulse-release-manifest.json').publication.pnpmVersion")"
          node scripts/pnpm-toolchain.cjs --install --version "$pnpm_version"
          export PATH="$PWD/.validation-tools/pnpm/bin:$PATH"
          echo "$PWD/.validation-tools/pnpm/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build on the current Node 22 support line
        run: pnpm run build
      - name: Run the focused Node 22 support-line CLI workflow
        run: node wasm/scripts/run-wasm-tests.cjs --task cli-init-workflow --report .test-results/node-floor.json
      - name: Upload Node 22 failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-node-floor-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm/.test-results
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  portable-shards:
    name: portable / ${{ matrix.shard }}
    needs: [route, maintenance]
    if: needs.route.outputs.run == 'true' && needs.route.outputs.tier == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [unit, native, javascript, conformance-rsa, conformance-schema, conformance-rest]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
      - name: Install lockfile-pinned workspace dependencies
        shell: bash
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          pnpm_version="$(node -p "require('./release/pulse-release-manifest.json').publication.pnpmVersion")"
          node scripts/pnpm-toolchain.cjs --install --version "$pnpm_version"
          export PATH="$PWD/.validation-tools/pnpm/bin:$PATH"
          echo "$PWD/.validation-tools/pnpm/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Build workspace outputs used by portable profiles
        run: pnpm run build
      - name: Run registered portable shard
        env:
          PORTABLE_SHARD: ${{ matrix.shard }}
        run: node scripts/maintainer-portable-validation.cjs run "$PORTABLE_SHARD"
      - name: Upload portable failure evidence and success reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-portable-shard-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: wasm/.test-results/portable/${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  full-portable:
    name: full portable
    needs: [route, portable-shards]
    if: always() && needs.route.outputs.run == 'true' && needs.route.outputs.tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
      - name: Download portable shard reports and failure evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pulse-portable-shard-${{ github.run_id }}-*
          path: .portable-artifacts
      - name: Require complete passing portable coverage
        if: always()
        env:
          PORTABLE_SHARDS_RESULT: ${{ needs.portable-shards.result }}
        run: node scripts/maintainer-portable-validation.cjs aggregate .portable-artifacts
      - name: Upload portable aggregate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pulse-portable-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: wasm/.test-results/portable-aggregate.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  portable:
    name: portable
    needs: [route, maintenance, node-floor, fast-selection, fast-portable, full-portable]
    if: always() && (github.event_name != 'push' || needs.route.outputs.run != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.x'
      - name: Require the event's complete validation tier
        env:
          VALIDATION_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/maintainer-validation-routing.cjs gate
