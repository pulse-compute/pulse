name: Release preparation

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next release version, without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-preparation
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.prepare.outputs.version }}
      branch: ${{ steps.prepare.outputs.branch }}
      base: ${{ steps.prepare.outputs.base }}
      head: ${{ steps.prepare.outputs.head }}
    steps:
      - name: Check out integration source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: latest
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install preparation dependencies
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: |
          set -euo pipefail
          pnpm_version="$(node -p "require('./release/pulse-release-manifest.json').publication.pnpmVersion")"
          node scripts/pnpm-toolchain.cjs --install --version "$pnpm_version"
          export PATH="$PWD/.validation-tools/pnpm/bin:$PATH"
          echo "$PWD/.validation-tools/pnpm/bin" >> "$GITHUB_PATH"
          pnpm install --frozen-lockfile --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Archive previous release and prepare reviewed changes
        id: prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
        run: node scripts/release-prepare-pr.cjs "$RELEASE_VERSION"
      - name: Upload prepared source bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-preparation-${{ github.run_id }}
          path: |
            .pulse-release-preparation/release.bundle
            .pulse-release-preparation/pr-body.md
            .pulse-release-preparation/prepared.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  open-pr:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-preparation-${{ github.run_id }}
          path: prepared
      - name: Push prepared commits and open a draft release PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_BRANCH: ${{ needs.prepare.outputs.branch }}
          RELEASE_BASE: ${{ needs.prepare.outputs.base }}
          RELEASE_HEAD: ${{ needs.prepare.outputs.head }}
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const fs = require('node:fs');
            const { execFileSync } = require('node:child_process');
            const { RELEASE_VERSION: version, RELEASE_BRANCH: branch, RELEASE_BASE: base, RELEASE_HEAD: head } = process.env;
            if (!/^[0-9A-Za-z.-]+$/.test(version) || !/^release\/prepare-[0-9A-Za-z.-]+-\d+$/.test(branch)) throw new Error('Invalid preparation identity');
            if (![base, head].every(value => /^[a-f0-9]{40}$/.test(value))) throw new Error('Invalid preparation commits');
            const current = await github.rest.git.getRef({ ...context.repo, ref: 'heads/main' });
            if (current.data.object.sha !== base) throw new Error('main advanced during preparation; rerun against the new base');
            const git = args => execFileSync('git', args, { encoding: 'utf8', maxBuffer: 32 * 1024 * 1024 }).trim();
            git(['bundle', 'verify', 'prepared/release.bundle']);
            git(['fetch', '--no-tags', 'prepared/release.bundle', `refs/heads/${branch}`]);
            if (git(['rev-parse', 'FETCH_HEAD']) !== head) throw new Error('Prepared bundle head mismatch');
            git(['merge-base', '--is-ancestor', base, head]);
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `heads/${branch}` });
              throw new Error('Preparation branch already exists; inspect it before starting a new preparation run');
            } catch (error) { if (error.status !== 404) throw error; }
            const auth = Buffer.from(`x-access-token:${process.env.GH_TOKEN}`).toString('base64');
            core.setSecret(auth);
            execFileSync('git', ['push', 'origin', `${head}:refs/heads/${branch}`], {
              encoding: 'utf8',
              env: { ...process.env, GIT_CONFIG_COUNT: '1', GIT_CONFIG_KEY_0: 'http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0: `AUTHORIZATION: basic ${auth}` }
            });
            try {
              const pr = await github.rest.pulls.create({ ...context.repo, head: branch, base: 'main', title: `release: prepare ${version}`, body: fs.readFileSync('prepared/pr-body.md', 'utf8'), draft: true });
              await core.summary.addLink('Review prepared release', pr.data.html_url).addRaw('\n\nMark the draft ready for review to trigger PR checks. Merge, tagging, and publication remain release-owner actions.').write();
            } catch (error) {
              core.setFailed(`Prepared branch ${branch} was pushed, but PR creation failed: ${error.message}. The repository must allow GitHub Actions to create pull requests; the branch can also be opened manually.`);
            }
